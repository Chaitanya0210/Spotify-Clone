
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotify-Clone</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav>
        <ul>
            <li class="brand"><img src="Spotify_App_Logo.svg.png" alt="spotify">Spotify</li>
            <li>Home</li>
            <li>About</li>
        </ul>
    </nav>


    <div class="container">
        <div class="songList">
            <h1>Best of DhurandhaR</h1>
            <div class="songItemContainer">
                <span class="songItem">
                    <img src="dhurandhar.jpg" alt="1">
                    <span>Dhruandhar</span>
                    <span class="songlistplay"><span class="timestamp">05:34<i class="fa-regular  fa-circle-play"></i></span></span>
                </div>
            </div>
        </div>
        <div class="songBanner"></div>
        </div>

        <div class="bottom">
            <input type="range" name="range" id="myProgressBar" min="0" max="100" >
            <div class="icons">
                <!-- font ic -->
                 <i class="fa-solid fa-3x fa-backward"></i>
                 <i class="fa-regular fa-3x fa-circle-play"></i>
                 <i class="fa-solid fa-3x fa-forward"></i>
            </div>
        </div>

    <script src="script.js"></script>
</body>
</html>
