
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotify-Clone</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav>
        <ul>
            <li class="brand"><img src="Spotify_App_Logo.svg.png" alt="spotify">Spotify</li>
            <li>Home</li>
            <li>About</li>
        </ul>
    </nav>


    <div class="container">
        <div class="songList">
            <h1>Best of DhurandhaR</h1>
            <div class="songItemContainer">
                <div class="songItem">
                    <img  alt="1">
                    <span class="songName">Dhruandhar</span>
                    <span class="songlistplay"><span class="timestamp">03:02<i id="0" class="fa-regular songItemPlay fa-circle-play"></i></span></span>
                    
                </div>

                <div class="songItem">
                    <img  alt="1">
                    <span class="songName">Dhruandhar</span>
                    <span class="songlistplay"><span class="timestamp">02:20<i id="1" class="fa-regular songItemPlay fa-circle-play"></i></span></span>
                    
                </div>

                <div class="songItem">
                    <img  alt="1">
                    <span class="songName">Dhruandhar</span>
                    <span class="songlistplay"><span class="timestamp">05:32<i id="2" class="fa-regular songItemPlay fa-circle-play"></i></span></span>
                    
                </div>

                <div class="songItem">
                    <img  alt="1">
                    <span class="songName">Dhruandhar</span>
                    <span class="songlistplay"><span class="timestamp">03:58<i id="3" class="fa-regular songItemPlay fa-circle-play"></i></span></span>
                    
                </div>
                <div class="songItem">
                    <img  alt="1">
                    <span class="songName">Dhruandhar</span>
                    <span class="songlistplay"><span class="timestamp">04:10<i id="4" class="fa-regular songItemPlay fa-circle-play"></i></span></span>
                    
                </div>
                <div class="songItem">
                    <img  alt="1">
                    <span class="songName">Dhruandhar</span>
                    <span class="songlistplay"><span class="timestamp">04:13<i id="5" class="fa-regular songItemPlay fa-circle-play"></i></span></span>
                    
                </div>
                <div class="songItem">
                    <img  alt="1">
                    <span class="songName">Dhruandhar</span>
                    <span class="songlistplay"><span class="timestamp">02:46<i id="6" class="fa-regular songItemPlay fa-circle-play"></i></span></span>
                    
                </div>
            </div>
        </div>
        <div class="songBanner"></div>
        </div>

        <div class="bottom">
            <input type="range" name="range" id="myProgressBar" value="0" min="0" max="100" >
            <div class="icons">
                <!-- font ic -->
                 <i class="fa-solid fa-3x fa-backward" id="previous"></i>
                 <i class="fa-regular cfa-3x fa-circle-play" id="masterPlay"></i>
                 <i class="fa-solid fa-3x fa-forward" id="next"></i>
            </div>
            <div class="songInfo">
                <img src="music.gif"  width="42px" id="gif" alt="gif"> <span id="masterSongName">Ez-Ez</span>
            </div>
        </div>

    <script src="script.js"></script>
</body>
</html>
